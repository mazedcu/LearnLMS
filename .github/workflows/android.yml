name: Android app

# Builds the LearnwithHasan Android app (android/) on every change to it,
# or by hand from the Actions tab ("Run workflow"), and publishes the
# *unsigned* APK as a GitHub release. It can't be installed as is: the
# server's deploy script (deploy/deploy.sh) downloads it, signs it with the
# key kept on the droplet, and serves it at
# https://learnwithhasan.xyz/app/learnwithhasan.apk

on:
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      LWH_VERSION_CODE: ${{ github.run_number }}
      LWH_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/learnwithhasan-unsigned.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.LWH_VERSION_NAME }}
          name: LearnwithHasan app ${{ env.LWH_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            Unsigned build of the Android app. Students install the signed copy from
            https://learnwithhasan.xyz/app/learnwithhasan.apk (signed by the server's deploy script).
          files: ${{ runner.temp }}/learnwithhasan-unsigned.apk
          make_latest: true
